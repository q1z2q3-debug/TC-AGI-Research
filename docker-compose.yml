version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: tc-agi-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  tc-agi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tc-agi-daemon
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - LOOP_INTERVAL_SEC=30
      - EMBEDDING_ENABLED=true
      - EMBEDDING_BASE_URL=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - tc_agi_data:/app/data
      - tc_agi_memory:/root/.tc-agi-memory.json
    restart: unless-stopped
    command: >
      sh -c "npm run build && node dist/daemon.js"

volumes:
  ollama_data:
  tc_agi_data:
  tc_agi_memory: